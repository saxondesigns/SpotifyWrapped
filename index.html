<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spotify Wrapped</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(.22,1,.36,1);--io:cubic-bezier(.65,0,.35,1);--hd:Archivo,"Arial Black",Impact,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050505;font-family:Figtree,"Segoe UI",Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:relative;aspect-ratio:9/16;height:min(100dvh,100vw*16/9);max-width:100vw;container-type:size;overflow:hidden;background:#121212;color:#fff;user-select:none;border-radius:clamp(0px,1.6cqw,18px);box-shadow:0 24px 80px rgba(0,0,0,.42)}
.stage.live{cursor:pointer}
.bars{position:absolute;top:3cqw;left:4cqw;right:4cqw;display:flex;gap:1cqw;z-index:30}
.bar{flex:1;height:.8cqw;background:rgba(128,128,128,.4);border-radius:1cqw;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--fg);transform:scaleX(0);transform-origin:0 50%}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:13cqw minmax(0,1fr) auto;padding:0 8cqw;text-align:center;overflow:hidden;animation:in .68s var(--ease) both;will-change:opacity,transform}
.dark{--bg:#121212;--fg:#f1f0e8;--p1:#f1f0e8;--p2:#121212;--acc:#a99cf8;background:#121212;color:#f1f0e8}
.light{--bg:#f1f0e8;--fg:#121212;--p1:#121212;--p2:#f1f0e8;--acc:#dcb400;background:#f1f0e8;color:#121212}
.blue{--bg:#16196b;--fg:#fff;--p1:#fff;--p2:#16196b;--acc:#8ea0ff;background:radial-gradient(120% 80% at 50% 38%,#3b4bd6,#16196b 70%,#0b0c3a);color:#fff}
.chk{--bg:#111;--fg:#f1f0e8;--acc:#ff4a2e;background:#111;color:#fff}
.bd{grid-row:2;position:relative;z-index:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.4cqw;padding:2cqw 0}
.bd>*{max-width:100%;opacity:0;animation:up 1s var(--ease) forwards}
.bd>*:nth-child(1){animation-delay:.1s}
.bd>*:nth-child(2){animation-delay:.35s}
.bd>*:nth-child(3){animation-delay:.6s}
.bd>*:nth-child(4){animation-delay:.85s}
.dc{grid-row:3;margin:0 -8cqw;height:var(--dh,26cqw);position:relative;overflow:hidden}
.pat{position:absolute;inset:0;animation:rise 1.4s var(--ease) both}
.rings .pat{background:repeating-radial-gradient(circle at 50% 100%,var(--p1) 0 5cqw,var(--p2) 5cqw 10cqw);transform-origin:50% 100%;animation:rise 1.4s var(--ease) both}
.dots .pat{background:radial-gradient(circle,var(--acc) 46%,transparent 48%) 0 0/12cqw 12cqw;animation:rise 1.4s var(--ease) both,drift 7s var(--io) 1.4s infinite alternate}
.stripes .pat{background:repeating-linear-gradient(90deg,var(--p1) 0 5cqw,var(--p2) 5cqw 10cqw);animation:rise 1.4s var(--ease) both,drift 7s var(--io) 1.4s infinite alternate}
.bgp{position:absolute;inset:0;z-index:0;background:repeating-conic-gradient(#f1f0e8 0 25%,#111 0 50%) 0 0/18cqw 18cqw;animation:drift 8s var(--io) infinite alternate}
.sqg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--acc);stroke-width:.9;stroke-linecap:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 3s var(--ease) .5s forwards;z-index:2}
@keyframes in{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:scale(.97)}}
@keyframes up{from{opacity:0;transform:translateY(6cqw)}to{opacity:1;transform:none}}
@keyframes rise{from{transform:translateY(100%)}}
@keyframes breathe{to{transform:scale(1.12)}}
@keyframes drift{to{background-position:36cqw 8cqw}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes float{to{transform:translateY(-2.5cqw) rotate(3deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes roll{to{background-position:-30cqw 0}}
@keyframes songfade{0%{opacity:.72}100%{opacity:0}}
@keyframes orbit-glow{0%{transform:translate(-16cqw,10cqw) scale(.82)}100%{transform:translate(16cqw,-8cqw) scale(1.18)}}
@keyframes shimmer-text{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}
.slide.playful:before{content:"";position:absolute;z-index:0;width:66cqw;height:66cqw;left:17cqw;top:30cqw;border-radius:50%;background:radial-gradient(circle,var(--acc),transparent 68%);opacity:.12;filter:blur(1cqw);pointer-events:none;animation:orbit-glow 5s var(--io) infinite alternate}
.slide.playful .hl{animation:shimmer-text 2.4s ease-in-out infinite}
.slide.recap{grid-template-rows:8cqw minmax(0,1fr) 2cqw}
.slide.recap .bd{gap:1.3cqw;padding:0 0 1cqw;justify-content:center}
.slide.recap .art2{width:29cqw;height:29cqw;aspect-ratio:auto;flex:none}
.slide.recap .t{font-size:4cqw;line-height:1.18}
.slide.recap .sub{font-size:2.8cqw;line-height:1.28}
.slide.recap .chips{gap:1cqw}
.slide.recap .chip{padding:1.2cqw 2.5cqw;font-size:2.8cqw!important}
.slide.recap .two{gap:1.5cqw}
.slide.recap .two .pill{font-size:3cqw;padding:2.2cqw 3.2cqw}
.sharelink{display:none;width:92%;height:9cqw;min-height:32px;padding:1cqw 2cqw;border:1px solid #ffffff66;border-radius:2cqw;background:#121212;color:#fff;font:2.4cqw Figtree,sans-serif}
@keyframes brand-arrive{0%{opacity:0;transform:translateY(28px) scale(.94);letter-spacing:.12em;filter:blur(8px)}65%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none;letter-spacing:0}}
@keyframes record-arrive{0%{opacity:0;transform:scale(.72) rotate(-18deg)}70%{opacity:1;transform:scale(1.06) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.h{font:800 6.2cqw/1.18 var(--hd);font-stretch:125%;letter-spacing:-.01em;text-wrap:balance}
.big{font:900 19cqw/1 var(--hd);font-stretch:125%;letter-spacing:-.03em;color:var(--acc)}
.t{font-size:5cqw;font-weight:600;line-height:1.3;text-wrap:balance}
.t b{font-weight:800}
.sub{font-size:3.4cqw;line-height:1.45;opacity:.9;text-wrap:balance;max-width:80cqw}
.hl{display:inline-block;background:#dcb400;color:#111;padding:.8cqw 2.4cqw;font:800 4.2cqw var(--hd);font-stretch:125%}
.pill{border:0;font:800 3.5cqw Figtree,sans-serif;padding:3cqw 7cqw;border-radius:9cqw;background:var(--fg);color:var(--bg);cursor:pointer;transition:transform .28s var(--ease),filter .28s ease,box-shadow .28s ease;box-shadow:0 6px 18px rgba(0,0,0,.16)}
.pill:hover{transform:translateY(-2px);filter:brightness(1.05);box-shadow:0 10px 24px rgba(0,0,0,.2)}
.pill:active{transform:translateY(0) scale(.98)}
.pill:focus-visible,.bm:focus-visible{outline:2px solid #1ed760;outline-offset:4px}
.gr{--bg:#000;--fg:#1ed760}
.wm{display:flex;align-items:center;justify-content:center;gap:2.2cqw;font:800 6.2cqw var(--hd);font-stretch:125%}
.wm svg{width:9cqw;height:9cqw;flex:none}
.titlecard .bd>*{opacity:1;animation:none}
.titlecard .wm{animation:brand-arrive 1.25s var(--ease) both}
.titlecard .globe{animation:record-arrive 1.25s var(--ease) .22s both}
.titlecard .t{animation:brand-arrive 1s var(--ease) .52s both}
.globe{position:relative;width:54cqw;height:54cqw;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#a9b8ff,#4553c9 45%,#161a6e 82%);box-shadow:0 8cqw 14cqw rgba(0,0,0,.45),inset -6cqw -8cqw 12cqw rgba(0,0,40,.55)}
.globe i{position:absolute;inset:0;background:repeating-linear-gradient(105deg,transparent 0 5cqw,rgba(255,255,255,.9) 5cqw 7.5cqw) 0 0/30cqw 100%;-webkit-mask:linear-gradient(205deg,transparent 45%,#000 78%);mask:linear-gradient(205deg,transparent 45%,#000 78%);animation:roll 7s var(--io) infinite alternate}
.globe svg{position:relative;width:26cqw;height:26cqw;filter:drop-shadow(0 1.5cqw 2cqw rgba(0,0,40,.5))}
.y26w{position:relative;width:100%;aspect-ratio:360/400}
.y26w svg.tx{width:100%;height:100%;overflow:visible}
.badge{position:absolute;left:50%;top:50%;width:34cqw;height:34cqw;margin:-17cqw 0 0 -17cqw;border-radius:50%;background:#111;display:grid;place-items:center;box-shadow:0 0 0 1.4cqw #111}
.badge svg{width:24cqw;height:24cqw}
.list{width:100%;min-width:0;display:flex;flex-direction:column;gap:2.4cqw}
.row{display:flex;align-items:center;gap:3cqw;padding:1.8cqw;border:.5cqw solid var(--fg);text-align:left;min-width:0;animation:up .68s var(--ease) both;transition:transform .28s var(--ease),background-color .28s ease,border-color .28s ease}
.row.win{background:#98cc0a;border-color:#98cc0a;color:#111}
.row .cv{width:11cqw;height:11cqw;flex:none}
.row>div{min-width:0;flex:1}
.row b,.row span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row b{font-size:3.4cqw;font-weight:800}
.row span{font-size:2.9cqw;opacity:.8}
.row i{font-style:normal;font-weight:800;font-size:3.4cqw;width:5cqw;text-align:center;flex:none}
.cv,.art,.art2,.me,.mo{object-fit:cover;background:linear-gradient(135deg,#1ed760,#16196b);display:block;transition:transform .45s var(--ease),filter .35s ease;will-change:transform}
.nf{background:linear-gradient(135deg,#1ed760,#16196b)}
.art{width:56cqw;height:56cqw;border:1.2cqw solid var(--fg);box-shadow:0 4cqw 9cqw rgba(0,0,0,.4)}
.art2{width:100%;aspect-ratio:1;border:.9cqw solid var(--fg);box-shadow:0 3cqw 6cqw rgba(0,0,0,.3)}
.me{width:50cqw;height:50cqw;border-radius:50%;border:.7cqw solid var(--fg)}
.mos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.6cqw;width:100%}
.mo{width:100%;aspect-ratio:1;animation:tile-in .62s var(--ease) both}
.mo.lg{display:grid;place-items:center;background:#111}
.mo.lg svg{width:70%}
.duo{display:flex;gap:4cqw;width:100%}
.dcell{flex:1;min-width:0;display:flex;flex-direction:column;gap:1cqw}
.dcell .lab{font-size:2.8cqw;font-weight:800;text-transform:uppercase;letter-spacing:.1em;opacity:.7;margin-top:1.5cqw}
.dcell b{font-size:3.4cqw;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcell span{font:900 6cqw var(--hd);font-stretch:125%;color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:2cqw;width:100%}
.chip{padding:1.6cqw 4cqw;border-radius:9cqw;background:var(--acc);color:#111;font-weight:800;animation:up .62s var(--ease) both;transition:transform .25s var(--ease),filter .25s ease}
.chip.o{background:transparent;border:.5cqw solid var(--fg);color:var(--fg)}
 .mapstory{display:block;padding:0;text-align:left;z-index:10;background:#121212;color:#f1f0e8}
.mapstory .bd{position:absolute;inset:0;display:block;padding:0;max-width:none;z-index:2}
.mapstory .bd>*{max-width:none;opacity:1;animation:none}
.maphead{position:absolute;top:7.5cqw;left:7cqw;right:7cqw;z-index:1200;max-width:none;padding:0;background:none;box-shadow:none;backdrop-filter:none;pointer-events:none}
.maphead h2{font:800 6.3cqw/1.04 var(--hd);letter-spacing:-.035em;color:#f1f0e8;text-shadow:0 2px 12px #000b}
#languageMap{position:absolute;left:0;right:0;top:0;bottom:0;width:100%;height:100%;background:#171a20;overflow:hidden;touch-action:none;cursor:grab}
#languageMap.dragging{cursor:grabbing}
#mapViewport{position:absolute;left:50%;top:50%;width:100%;height:auto;aspect-ratio:2/1;transform:translate(-50%,-50%);transform-origin:50% 50%;will-change:transform}
#worldOutline{display:block;width:100%;height:100%;overflow:visible}
#worldMarkers{position:absolute;inset:0}
.world-country{fill:#252a32;stroke:#656c78;stroke-width:.65;vector-effect:non-scaling-stroke;transition:fill .25s ease,stroke .25s ease}
.world-country.has-artists{fill:#1c6542;stroke:#75d99e}
.world-marker{position:absolute;width:clamp(23px,7cqw,38px);height:clamp(23px,7cqw,38px);border:2px solid #f1f0e8;border-radius:50%;overflow:hidden;background:#252a32;box-shadow:0 3px 10px #0009;transform:translate(-50%,-50%) scale(var(--inv,1));padding:0;cursor:pointer;z-index:3}
.world-marker img{width:100%;height:100%;object-fit:cover;display:block}
.world-marker span{display:grid;place-items:center;width:100%;height:100%;font-size:10px;font-weight:800;color:white}
.map-zoom{position:absolute;right:5cqw;bottom:108px;z-index:1300;display:flex;flex-direction:column;gap:1.2cqw}
.map-zoom button{width:10cqw;height:10cqw;max-width:48px;max-height:48px;border:1px solid #555b66;border-radius:50%;background:#20242b;color:#fff;font:700 26px/1 Figtree,sans-serif;cursor:pointer;box-shadow:0 3px 12px #0008}
.map-zoom button:active{background:#1ed760;color:#111}
.map-zoom button:focus-visible{outline:2px solid #1ed760;outline-offset:3px}
@keyframes tile-in{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@media(hover:hover){.row:hover{transform:translateX(2px)}.cv:hover,.art:hover,.art2:hover,.me:hover,.mo:hover{transform:scale(1.025)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqw;padding:10cqw;text-align:center;animation:in .9s var(--ease) both}
.scr textarea{width:100%;height:13cqw;padding:2.5cqw 3cqw;border-radius:3cqw;border:.4cqw solid #444;background:#1e1e1e;color:#fff;font:500 2.8cqw Figtree,sans-serif;outline:0;resize:none;transition:border-color .4s var(--ease)}
.scr textarea:focus{border-color:#1ed760}
.step{font-size:2.8cqw;line-height:1.6;opacity:.85;text-align:left}
.bm{display:inline-block;padding:.4cqw 2cqw;border-radius:2cqw;background:#1ed760;color:#000;font-weight:800;text-decoration:none;cursor:grab}
.two{display:flex;gap:2cqw;justify-content:center;flex-wrap:wrap}
.two .pill{font-size:3cqw;padding:2.6cqw 4.4cqw}
.err{font-size:2.8cqw;color:#ff7a7a;line-height:1.4}
#emb{display:none;position:fixed;left:50%;bottom:calc(1.5dvh + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(300px,92vw);height:80px;opacity:1;pointer-events:auto;z-index:40;border-radius:12px;overflow:hidden;box-shadow:none}
.stage.live ~ #emb{display:block}
.songfade{position:absolute;inset:0;z-index:25;pointer-events:none;background:#050505;animation:songfade .48s ease-out forwards}
@media(max-width:480px){.stage{border-radius:0;box-shadow:none}.maphead{top:10cqw}.maphead h2{font-size:6.5cqw}#languageMap{top:40cqw;bottom:50cqw}.map-zoom{bottom:4cqw}}
</style>

  if(peakYear&&byDate.length){

  }
  if(collabs)s.push({d:6000,th:"chk",pat:"dots",tr:tk(8),h:`<span class="hl">Better together</span><div class="big" style="font-size:18cqw">${collabs}</div><div class="h">top songs had a plus-one.</div><div class="sub">Your collab era is thriving.</div>`});
  s.push({d:6000,th:"blue",tr:tk(8),h:`<div class="sub">Your listening character</div><div class="h" style="font-size:9cqw;color:#fff">${ar[1]}</div><div class="sub">${ar[2]}</div>`});

  }

  const summaryGenre=G[0]&&G[0].name?G[0].name:"your own genre";
  const summaryArtist=AR[0]&&AR[0].name?AR[0].name:artistLeaders[0]?artistLeaders[0][0]:"your favorite artists";
  s.push({d:0,th:"blue",pat:"rings",dh:2,playful:1,recap:1,tr:T[0],h:`<span class="hl">Your Wrapped, in one breath</span><div class="h">An all-time soundtrack of excellent decisions.</div>${im(T[0],"art2")}<div class="t"><b>${esc(T[0].name)}</b><br><span style="font-weight:400">by ${esc((T[0].artists||[]).map(a=>a.name).join(", "))}</span></div><div class="chips"><span class="chip">${esc(summaryArtist)}</span><span class="chip o">${esc(summaryGenre)}</span><span class="chip o">${n} top tracks</span></div><div class="sub">${D.year_summary?`${Number(mins).toLocaleString()} minutes of listening`:`Your top tracks run about ${Number(mins).toLocaleString()} minutes`} · ${na} artists · ${collabs} collabs</div><div class="two"><button class="pill gr" onclick="event.stopPropagation();shareWrapped()">Share my Wrapped</button><button class="pill" onclick="event.stopPropagation();show(0)">Replay</button></div><p id="shareNote" class="sub" aria-live="polite"></p><textarea id="shareUrlBox" class="sharelink" readonly aria-label="Share link"></textarea>`});
  const used=new Set();
  const topSongSlide=s.find(slide=>slide.h.includes("<b>Your top song</b>"));
  const deepSlide=s.find(slide=>slide.deep);
  if(topSongSlide&&T[0].spotify_id)used.add(T[0].spotify_id);
  if(deepSlide&&deepSlide.tr&&deepSlide.tr.spotify_id)used.add(deepSlide.tr.spotify_id);

  if(fanSlide&&fanSlide.tr&&fanSlide.tr.spotify_id)used.add(fanSlide.tr.spotify_id);
  s.forEach(slide=>{
    if(slide.h.includes("Fan club president")){if(slide.tr&&slide.tr.spotify_id)used.add(slide.tr.spotify_id);return}
    if(slide===topSongSlide||slide===deepSlide)return;
    let chosen=null;
    if(slide.h.includes("<b>Your top song</b>"))chosen=T[0];
    else if(slide.h.includes("Your top albums")&&AL[0])chosen=albumTrack(AL[0],used);
    else if(slide.h.includes("live on one album"))chosen=pick(x=>x.image_url_large&&x.image_url_large===top1[0].image_url_large,used);

    if(!chosen||!chosen.spotify_id||used.has(chosen.spotify_id))chosen=pick(()=>true,used);
    slide.tr=chosen||null;
    if(chosen&&chosen.spotify_id)used.add(chosen.spotify_id);
  });
  return s;
}

async function encodeShareData(value){
  const raw=new TextEncoder().encode(JSON.stringify(value));
  let bytes=raw,kind="j";
  if("CompressionStream" in window){
    try{const stream=new Blob([raw]).stream().pipeThrough(new CompressionStream("gzip"));bytes=new Uint8Array(await new Response(stream).arrayBuffer());kind="g"}catch(e){}
  }
  let binary="";for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
  return kind+btoa(binary).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"");
}
async function shareWrapped(){
  if(!D)return;
  const note=document.getElementById("shareNote"),box=document.getElementById("shareUrlBox");
  if(!SHARE_API_URL){if(note)note.textContent="Short links need the share storage Worker. Add its URL in SHARE_API_URL after setup.";return}
  const slimArtist=a=>({name:String(a&&a.name||""),image_url_large:a&&(a.image_url_large||a.image_url_small)||""});
  const payload={
    u:{n:D.name||"",country:D.country||""},
    s:{
      top_tracks:(D.s.top_tracks||[]).slice(0,100).map(t=>{const album=t.album||{};return{
        name:String(t.name||""),spotify_id:String(t.spotify_id||t.id||""),duration_ms:Number(t.duration_ms)||0,
        release_date:String(t.release_date||""),image_url_large:t.image_url_large||t.image_url_small||"",
        artists:(t.artists||[]).map(a=>({name:String(a&&a.name||"")})),album:{name:String(album.name||"")}
      }}),
      top_artists:(D.s.top_artists||[]).slice(0,100).map(slimArtist),
      top_albums:(D.s.top_albums||[]).slice(0,100).map(a=>({name:String(a.name||""),image_url_large:a.image_url_large||a.image_url_small||"",artists:(a.artists||[]).map(x=>({name:String(x&&x.name||"")}))})),
      top_genres:(D.s.top_genres||[]).slice(0,100).map(g=>({name:String(g.name||"")}))
    },year_summary:D.year_summary||null,tf:D.time_frame||"long",all_time:true
  };
  try{
    if(note)note.textContent="Saving your Wrapped…";
    const response=await fetch(SHARE_API_URL.replace(/\/$/,"")+"/api/shares",{
      method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:D.name||"Wrapped",country:D.country||"",payload})
    });
    const result=await response.json();if(!response.ok)throw new Error(result.error||"Could not save your Wrapped.");
    const target=new URL(/\/share(?:\/(?:index\.html?)?)?$/.test(location.pathname)?"./":"share/",location.href);
    target.search="?u="+encodeURIComponent(result.slug);target.hash="";
    const url=target.href;if(box){box.value=url;box.style.display="block"}
    const caption=`My Spotify Wrapped: ${D.s.top_tracks[0]?.name||"a year in music"}${D.s.top_artists?.[0]?.name?" · Top artist: "+D.s.top_artists[0].name:""}`;
    if(navigator.share){await navigator.share({title:"My Spotify Wrapped",text:caption,url});if(note)note.textContent="Your Wrapped is saved. Here’s your share page ✨";return}
    if(!navigator.clipboard||!navigator.clipboard.writeText)throw new Error("Clipboard unavailable");
    await navigator.clipboard.writeText(url);if(note)note.textContent="Your Wrapped is saved and the short link is copied ✨";
  }catch(e){
    if(e&&e.name==="AbortError")return;
    if(note)note.textContent=(e&&e.message)||"Couldn’t save your Wrapped. Check that the share service is online.";
    if(box&&box.value)box.select();
  }
}
async function decodeShareData(token){
  if(!token||token.length<2)throw new Error("This Wrapped link is incomplete.");
  const kind=token[0],b64=token.slice(1).replace(/-/g,"+").replace(/_/g,"/");
  const binary=atob(b64+"=".repeat((4-b64.length%4)%4));
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  let data=bytes;
  if(kind==="g"){
    if(!("DecompressionStream" in window))throw new Error("Open this Wrapped link in a newer browser.");
    data=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
  }
  return new TextDecoder().decode(data);
}

function counters(root){
  root.querySelectorAll("[data-n]").forEach(el=>{
    const end=+el.dataset.n,t0=performance.now()+400;
    (function step(){
      if(!el.isConnected)return;
      const p=Math.max(0,Math.min((performance.now()-t0)/1800,1)),e=p===1?1:1-Math.pow(2,-10*p);
      el.textContent=Math.round(end*e).toLocaleString("en-US");
      if(p<1)requestAnimationFrame(step);
    })();
  });
}
function story(){
  live=true;
  storyPaused=false;
  stage.className="stage live";
  stage.innerHTML='<div class="bars">'+S.map(()=>'<div class="bar"><i></i></div>').join("")+"</div>";
  show(0);
}
function show(i){
  clearTimeout(tm);
  slideRemaining=0;
  activeSlideDuration=0;
  if(i<0)i=0;
  if(i>=S.length)return;
  cur=i;
  const s=S[i];
  stage.className="stage live";
  positionPlayer();
  stage.querySelectorAll(".slide").forEach(o=>o.remove());
  const el=document.createElement("div");
  el.className="slide "+s.th+(s.pat?" "+s.pat:"")+(s.map?" mapstory":"")+(s.title?" titlecard":"")+(s.playful?" playful":"")+(s.recap?" recap":"");
  el.innerHTML=`${s.full?'<div class="bgp"></div>':""}<div class="bd">${s.h}</div>${s.pat?`<div class="dc" style="--dh:${s.dh||26}cqw"><div class="pat"></div>${SQ}</div>`:`<div class="dc" style="--dh:${s.full||s.map?0:8}cqw"></div>`}`;
  stage.insertBefore(el,stage.querySelector(".bars"));
  const fg=getComputedStyle(el).getPropertyValue("--fg");
  stage.style.setProperty("--fg",fg);
  counters(el);
  if(s.map)mountMap(el);
  stage.querySelectorAll(".bar").forEach((b,j)=>{
    const f=b.firstChild;
    f.style.transition="none";
    f.style.transform="scaleX("+(j<i?1:0)+")";
    f.style.background=fg;
    if(j===i&&s.d){f.offsetWidth;f.style.transition="transform "+s.d+"ms linear";f.style.transform="scaleX(1)"}
    if(j===i&&!s.d)f.style.transform="scaleX(1)";
  });
  if(s.tr){const key=s.tr.spotify_uri||(s.tr.spotify_id&&"spotify:track:"+s.tr.spotify_id);if(key)playedTracks.delete(key)}
  snippet(s.tr);
  const shown=cur;
  if(s.d){slideRemaining=s.d;slideStartedAt=performance.now();if(!storyPaused)tm=setTimeout(()=>{if(cur===shown)show(shown+1)},s.d)}
}
function pauseStory(){
  if(!live||storyPaused)return;
  storyPaused=true;clearTimeout(tm);clearTimeout(holdTimer);
  if(slideRemaining){slideRemaining=Math.max(0,slideRemaining-(performance.now()-slideStartedAt));const fill=stage.querySelectorAll(".bar i")[cur];if(fill){const r=fill.getBoundingClientRect(),bar=fill.parentElement.getBoundingClientRect();const progress=Math.max(0,Math.min(1,r.width/bar.width));fill.style.transition="none";fill.style.transform=`scaleX(${progress})`}}
}
function resumeStory(){
  if(!live||!storyPaused)return;
  storyPaused=false;
  const s=S[cur];if(!s||!s.d)return;
  const fill=stage.querySelectorAll(".bar i")[cur],remaining=slideRemaining||s.d;
  if(fill){const bar=fill.parentElement.getBoundingClientRect(),current=bar.width?fill.getBoundingClientRect().width/bar.width:0;fill.style.transition="none";fill.style.transform=`scaleX(${current})`;fill.offsetWidth;fill.style.transition=`transform ${remaining}ms linear`;fill.style.transform="scaleX(1)"}
  const shown=cur;slideStartedAt=performance.now();slideRemaining=remaining;tm=setTimeout(()=>{if(cur===shown&&!storyPaused)show(shown+1)},remaining);
}
stage.addEventListener("pointerdown",e=>{
  if(!live||e.target.closest("button,a,input,textarea,.maphead,.map-zoom,#languageMap"))return;
  try{stage.setPointerCapture(e.pointerId)}catch(x){}
  gesture={x:e.clientX,y:e.clientY,id:e.pointerId,moved:false};holdTimer=setTimeout(pauseStory,180);
});
stage.addEventListener("pointermove",e=>{if(gesture&&gesture.id===e.pointerId&&Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)>18){gesture.moved=true;clearTimeout(holdTimer)}});
stage.addEventListener("pointerup",e=>{
  if(!gesture||gesture.id!==e.pointerId)return;
  clearTimeout(holdTimer);const g=gesture;gesture=null;
  if(storyPaused){resumeStory();return}
  if(g.moved){const dx=e.clientX-g.x;if(Math.abs(dx)>36)show(dx<0?cur+1:cur-1);return}
  const r=stage.getBoundingClientRect();show(e.clientX-r.left<r.width*.35?cur-1:cur+1);
});
stage.addEventListener("pointercancel",()=>{clearTimeout(holdTimer);gesture=null;if(storyPaused)resumeStory()});
document.addEventListener("keydown",e=>{
  if(!live)return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();show(cur+1)}
  if(e.key==="ArrowLeft"){e.preventDefault();show(cur-1)}
  if(e.key==="Escape"||e.key==="p"||e.key==="P"){e.preventDefault();storyPaused?resumeStory():pauseStory()}
});
window.addEventListener("message",e=>{let host="";try{host=new URL(e.origin).hostname}catch(x){}if((host==="volt.fm"||host.endsWith(".volt.fm"))&&e.data&&e.data.wrapped){clearTimeout(tm);live=false;playedTracks.clear();currentTrackId="";load(e.data.p)}});

async function boot(){
  const slug=new URLSearchParams(location.search).get("u");
  if(slug){
    try{
      if(!SHARE_API_URL)throw new Error("This share page needs its storage service configured.");
      const response=await fetch(SHARE_API_URL.replace(/\/$/,"")+"/api/shares/"+encodeURIComponent(slug));
      const result=await response.json();if(!response.ok)throw new Error(result.error||"This Wrapped link could not be found.");
      D=parse(JSON.stringify(result.payload));S=build();story();return;
    }catch(e){home((e&&e.message)||"This Wrapped link could not be opened.");return}
  }
  const match=location.hash.match(/(?:^#|&)wrapped=([^&]+)/);
  if(match){
    try{D=parse(await decodeShareData(match[1]));S=build();story();return}
    catch(e){home("This share link could not be opened. It may have been copied incompletely.");return}
  }
  let saved=null;try{saved=JSON.parse(localStorage.getItem("wrapped-all-time-v1"))}catch(e){}
  if(saved&&saved.s&&saved.s.top_tracks){D=saved;ready()}else home();
}
boot();
